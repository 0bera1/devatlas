# Üretim yapılandırması. Kullanım: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Tüm gizli değerler zorunludur; tanımsızsa Compose başlamaz. Veritabanı ve API dış ağa açık değildir.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tanımlı olmalı}
      POSTGRES_DB: devatlas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devatlas"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/server
      dockerfile: DockerFile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3500"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/devatlas?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET tanımlı olmalı}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-10m}
      REFRESH_TOKEN_EXPIRES_DAYS: ${REFRESH_TOKEN_EXPIRES_DAYS:-7}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN tanımlı olmalı}
      APP_URL: ${APP_URL:?APP_URL tanımlı olmalı}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST tanımlı olmalı}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM tanımlı olmalı}
      UPLOAD_DIR: /app/uploads
      RUN_DB_SEED_ON_STARTUP: ${RUN_DB_SEED_ON_STARTUP:-false}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    volumes:
      - uploads:/app/uploads

  web:
    build:
      context: ./apps/client
      dockerfile: DockerFile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL tanımlı olmalı}
    restart: unless-stopped
    depends_on:
      - api

  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN tanımlı olmalı}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN tanımlı olmalı}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
