name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    name: İstemci (derleme)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/client/package-lock.json

      - run: npm ci
      - run: npm run build
